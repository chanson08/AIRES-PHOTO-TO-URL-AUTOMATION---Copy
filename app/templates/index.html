<!DOCTYPE html>
<html>
<head>
    <title>EcoQPay Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            width: 500px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        input[type=file] {
            width: 100%;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: black;
        }

        img {
            margin-top: 20px;
            max-width: 100%;
        }

        .error {
            margin-top: 15px;
            color: red;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>EcoQPay QR Generator</h2>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="image" accept="image/*" required>
        <button type="submit">Generate QR</button>
    </form>

    {% if ecoqpay_image_base64 %}
        <h3>Generated EcoQPay</h3>
        <img src="data:image/png;base64,{{ ecoqpay_image_base64 }}">
    {% endif %}

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
</div>
</body>
</html>
